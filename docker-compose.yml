services:
  postgres:
    image: postgres:16-alpine
    container_name: kitchenasty-db
    environment:
      POSTGRES_USER: kitchenasty
      POSTGRES_PASSWORD: kitchenasty
      POSTGRES_DB: kitchenasty
    ports:
      # Host 5433 avoids clash with a local Windows PostgreSQL on 5432
      - "5433:5432"
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitchenasty"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: packages/server/Dockerfile
    container_name: kitchenasty-server
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: development
      DATABASE_URL: postgresql://kitchenasty:kitchenasty@postgres:5432/kitchenasty
      CORS_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5176,http://localhost:5177
      JWT_SECRET: change-this-to-a-random-secret
      JWT_EXPIRES_IN: 7d
    depends_on:
      postgres:
        condition: service_healthy

  admin:
    build:
      context: .
      dockerfile: packages/admin/Dockerfile
    container_name: kitchenasty-admin
    ports:
      - "5173:80"
    depends_on:
      - server

  storefront:
    build:
      context: .
      dockerfile: packages/storefront/Dockerfile
    container_name: kitchenasty-storefront
    ports:
      - "5174:80"
    depends_on:
      - server

  docs:
    build:
      context: .
      dockerfile: packages/docs/Dockerfile
    container_name: kitchenasty-docs
    ports:
      - "5175:80"

  prisma-generate:
    image: node:22
    volumes:
      - .:/app
      - ./certs/netskope-ca-bundle.crt:/etc/ssl/certs/netskope-ca-bundle.crt:ro
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/netskope-ca-bundle.crt
    working_dir: /app
    command: npx prisma generate --schema prisma/schema.prisma
    profiles:
      - tools

  prisma-migrate:
    image: node:22
    volumes:
      - .:/app
      - ./certs/netskope-ca-bundle.crt:/etc/ssl/certs/netskope-ca-bundle.crt:ro
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/netskope-ca-bundle.crt
      DATABASE_URL: postgresql://kitchenasty:kitchenasty@postgres:5432/kitchenasty
    working_dir: /app
    command: npx -w packages/server prisma migrate deploy --schema ../../prisma/schema.prisma
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy

  prisma-seed:
    image: node:22
    volumes:
      - .:/app
      - ./certs/netskope-ca-bundle.crt:/etc/ssl/certs/netskope-ca-bundle.crt:ro
    environment:
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/netskope-ca-bundle.crt
      DATABASE_URL: postgresql://kitchenasty:kitchenasty@postgres:5432/kitchenasty
    working_dir: /app
    command: >
      sh -c "npm rebuild esbuild --silent 2>/dev/null;
      npx -w packages/server prisma db seed"
    profiles:
      - tools
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
